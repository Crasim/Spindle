[package]
name = "spindle"
version = "0.3.0-beta.44"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "spindle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ring = "0.17"
webbrowser = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls","multipart"] }
image = {version="0.25",default-features=false,features=["png","jpeg"]}
arboard = { version = "3", default-features = false, features = ["image-data"] }
calamine = "0.31"
csv = "1.3"
zip = {version="4.6",default-features=false,features=["deflate"]}
roxmltree = "0.20"
html2text = "0.15"
pulldown-cmark = {version="0.13",default-features=false}
chrono = { version="0.4", features=["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs", "process"] }
cpal = "0.15"
rodio = { version = "0.20", default-features = false, features = ["wav", "symphonia-mp3"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "ws"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.13"
spake2 = "0.4"
qrcode = { version = "0.14", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
jsonwebtoken = { version = "9", default-features = false }
wry = { version = "0.54", default-features = false, features = ["protocol"] }
windows = { version="0.58", features=["Data_Pdf","Data_Xml_Dom","Devices_Geolocation","Storage_Streams","Foundation","Foundation_Collections","Security_Cryptography_DataProtection","UI_Notifications","Win32_System_WinRT","Win32_System_Com","Win32_UI_Accessibility","Win32_UI_Shell","Win32_UI_Shell_PropertiesSystem"] }
raw-window-handle = "0.6"
windows-sys = {version="0.59", features=["Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Shell","Win32_System_Com","Win32_System_Console","Win32_System_SystemInformation","Win32_Graphics_Dwm","Win32_Graphics_Gdi","Win32_Foundation","Win32_Security","Win32_Security_Isolation","Win32_Security_Authorization","Win32_Storage_FileSystem","Win32_System_JobObjects","Win32_System_Pipes","Win32_System_Registry","Win32_System_Threading"]}
rfd = { version = "0.15", default-features = false }
keyring = {version="3", features=["windows-native"]}
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13.2", default-features = false, features = ["shape", "xtest"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"

# Keep the frequently used layout and drawing code fast.
[profile.release.package.egui]
opt-level = 3

[profile.release.package.epaint]
opt-level = 3

[profile.release.package.emath]
opt-level = 3
